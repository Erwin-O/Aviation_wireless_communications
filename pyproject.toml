[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-messaging"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
# Root-level modules that scripts import directly (not part of any sub-package)
py-modules = ["mqtt_client", "settings"]

[tool.setuptools.packages.find]
where = ["."]
# finds core/, encryption/, config/, utils/ (all have __init__.py)
# scripts/, visualisation/, logs/ etc. have no __init__.py and are skipped automatically
